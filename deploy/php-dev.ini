; Ajustes de PHP para el contenedor de pruebas.
; Este archivo se carga al final (prefijo zz-) para ganar a los de la imagen base.

; ---------------------------------------------------------------------------
; Errores
; ---------------------------------------------------------------------------
; display_errors apagado a propósito: varias respuestas 500 de la app incluyen el
; mensaje de la excepción en el cuerpo, así que mostrar errores en pantalla
; sumaría una segunda vía de fuga. Los errores van al log, que se lee con
; `docker compose logs -f app`. Para depurar, poner display_errors=On en local.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; ---------------------------------------------------------------------------
; Seguridad
; ---------------------------------------------------------------------------
; No sirve la versión de PHP en cabeceras ni delata la configuración.
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; ---------------------------------------------------------------------------
; Sesión y zona horaria
; ---------------------------------------------------------------------------
; session.save_path fuera del docroot: los archivos de sesión tampoco deben
; quedar servibles por el navegador.
session.save_path = "/var/www/storage/sessions"
date.timezone = "America/Lima"

; ---------------------------------------------------------------------------
; Límites
; ---------------------------------------------------------------------------
; Los adjuntos se suben directo a S3 con URL prefirmada, pero el margen queda
; holgado para pedidos multipart por si se usan.
upload_max_filesize = 12M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 60
