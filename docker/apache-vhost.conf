<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # -----------------------------------------------------------------------
    # Lo que no es una página pública no se sirve. No hay directorio public/:
    # en el despliegue anterior, con `php -S` desde la raíz del proyecto, el
    # .env era descargable con GET /.env, con las llaves de AWS dentro.
    # Aquí se cierra por ruta, por extensión y por archivo suelto.
    # -----------------------------------------------------------------------
    <DirectoryMatch "^/var/www/html/(includes|docs|tests|bin|docker|vendor|\.git)/">
        Require all denied
    </DirectoryMatch>

    # .env y cualquier variante (.env.local, .env.prod...).
    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>

    # Documentos, esquemas y logs: no son páginas.
    <FilesMatch "\.(sql|md|log|ini|lock|dist|bak|swp)$">
        Require all denied
    </FilesMatch>

    # Sin listado de directorios: /admin/ no debe revelar los .php que hay.
    <DirectoryMatch "^/var/www/html/">
        Options -Indexes
    </DirectoryMatch>

    # -----------------------------------------------------------------------
    # Sesiones fuera del docroot
    # -----------------------------------------------------------------------
    php_admin_value session.save_path "/var/www/storage/sessions"
    php_admin_flag session.cookie_httponly On
    php_admin_flag session.cookie_samesite Lax

    # -----------------------------------------------------------------------
    # Cabeceras de seguridad
    # -----------------------------------------------------------------------
    # La app ya manda su propia CSP por página, así que aquí no se repite para
    # no duplicar la política. Se añade lo que no depende de la vista.
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    # -----------------------------------------------------------------------
    # Registro de acceso
    # -----------------------------------------------------------------------
    CustomLog /dev/stdout combined
    ErrorLog /dev/stderr
</VirtualHost>
