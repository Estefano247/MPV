; =====================================================================
; /solicitudes — PHP (cPanel, PHP CGI/FastCGI lee .user.ini del directorio)
; =====================================================================
; Equivalente de deploy/php-dev.ini. Solo aplica si el PHP corre en CGI o
; FPM (en cPanel, sí); con mod_php se cambia desde "Select PHP Version".
;
; Verificar: phpinfo() en una página del portal y buscar "Loaded Configuration
; File" y "user_ini.filename".
; =====================================================================

; Sin esto los acuses salen 5 horas desfasados: AcuseService usa la timezone
; por defecto y PHP devuelve UTC si no está fijada.
date.timezone = America/Lima

; Los errores de las excepciones no van a pantalla (el código ya los manda a
; error_log). En local, para depurar, se cambia a On.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; AmspApiClient usa stream como fallback cuando falta curl.
allow_url_fopen = On
allow_url_include = Off

; Adjuntos: el JSON del alta lleva los metadatos de los archivos (los binarios
; van directo a S3 por PUT, no pasan por PHP), pero hay margen.
upload_max_filesize = 12M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 60

; La sesión vive fuera del docroot por defecto en cPanel (/tmp o el path del
; hosting): no hace falta fijar session.save_path. Si se fija, que sea un
; directorio FUERA de public_html.
session.cookie_httponly = 1
session.cookie_samesite = Lax
